
on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch to diff against (only used when cargo_deny_check=auto)"
        type: string
        default: master
      cargo_deny_check:
        description: "Run or skip the `cargo deny` step"
        type: choice
        options:
          - auto
          - force-run
          - force-skip
        default: auto

name: Check, Lint, Build

env:
  CARGO_TERM_COLOR: always
  ELECTRS_VERSION: v3.2.0
  BITCOIND_UNPATCHED_VERSION: "30.2"

jobs:
  check-lint:
    name: Check, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - name: Install pinned Rust toolchain
        # Channel and components come from rust-toolchain.toml, which is the
        # single source of truth for the Rust version.
        run: rustup toolchain install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-all-crates: "true"
          shared-key: debug-x86_64-unknown-linux-gnu

      - name: Rustfmt
        run: cargo fmt -- --check
      
      - name: Cargo check
        run: cargo check --all-targets --all-features
      
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      
      - name: Check changed files
        id: changed-files
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.cargo_deny_check == 'auto')
        uses: dorny/paths-filter@v4
        with:
          filters: |
            cargo_lock:
              - 'Cargo.lock'
            deny_toml:
              - 'deny.toml'

      - name: Deny
        if: >-
          (github.event_name == 'pull_request' && (steps.changed-files.outputs.cargo_lock == 'true' || steps.changed-files.outputs.deny_toml == 'true')) ||
          (github.event_name == 'workflow_dispatch' && inputs.cargo_deny_check == 'force-run') ||
          (github.event_name == 'workflow_dispatch' && inputs.cargo_deny_check == 'auto' && (steps.changed-files.outputs.cargo_lock == 'true' || steps.changed-files.outputs.deny_toml == 'true'))
        uses: EmbarkStudios/cargo-deny-action@v2

  cache-electrs:
    name: Build electrs if not cached
    runs-on: ubuntu-latest
    steps:
      - name: Check cache
        id: check-cache
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-${{ env.ELECTRS_VERSION }}

      - name: Build electrs
        if: steps.check-cache.outputs.cache-hit != 'true'
        # The rocksdb source in electrs uses uint64_t without <cstdint>, which
        # GCC 13 and later reject.
        env:
          CXXFLAGS: -include cstdint
        run: |
          git clone --branch ${{ env.ELECTRS_VERSION }} --depth 1 https://github.com/mempool/electrs.git ${{ runner.temp }}/electrs
          pushd ${{ runner.temp }}/electrs
          cargo build --locked --release
          popd

      - name: Save cache
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-${{ env.ELECTRS_VERSION }}


  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [cache-electrs, check-lint]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      # The enforcer scripts hold the eCash channel and its regtest
      # parameters, so they move with the submodule.
      - name: Read ecash-com/bitcoin parameters
        id: ecash
        run: |
          setup=bip300301_enforcer/scripts/setup_integration_tests.sh
          channels="$("$setup" --print-channels)"
          if [ "$(printf '%s\n' "$channels" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one ecash channel, got: $channels"
            exit 1
          fi
          {
            echo "channel=$channels"
            echo "regtest_magic=$("$setup" --print-regtest-magic "$channels")"
            echo "op_drivechain=$("$setup" --print-op-drivechain "$channels")"
            echo "fork=$("$setup" --print-fork "$channels")"
            echo "replay_protection_lock_time=$("$setup" --print-replay-protection-lock-time "$channels")"
          } >> "$GITHUB_OUTPUT"

      - name: Download ecash-com/bitcoin (${{ steps.ecash.outputs.channel }})
        run: |
          bip300301_enforcer/scripts/fetch_ecash_bitcoin.sh \
            '${{ steps.ecash.outputs.channel }}' \
            x86_64-unknown-linux-gnu \
            '${{ runner.temp }}/deps/bitcoin-ecash'

      - name: Cache bitcoin unpatched
        id: cache-bitcoin-unpatched
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/deps/bitcoin-unpatched
          key: bitcoin-unpatched-x86_64-linux-${{ env.BITCOIND_UNPATCHED_VERSION }}

      - name: Download bitcoin unpatched
        if: steps.cache-bitcoin-unpatched.outputs.cache-hit != 'true'
        run: |
          cd "${{ runner.temp }}"
          VERSION='${{ env.BITCOIND_UNPATCHED_VERSION }}'
          TARBALL="bitcoin-${VERSION}-x86_64-linux-gnu.tar.gz"
          wget -q "https://bitcoincore.org/bin/bitcoin-core-${VERSION}/${TARBALL}" \
            "https://bitcoincore.org/bin/bitcoin-core-${VERSION}/SHA256SUMS"
          sha256sum --ignore-missing --check SHA256SUMS
          tar -xf "${TARBALL}"
          rm "${TARBALL}" SHA256SUMS
          mkdir -p deps
          rm -rf deps/bitcoin-unpatched
          mv "bitcoin-${VERSION}/bin" deps/bitcoin-unpatched
          rm -r "bitcoin-${VERSION}"

      # Use the enforcer release that the submodule pins, not the moving
      # `latest` build.
      - name: Find the enforcer release tag of the submodule
        id: enforcer
        run: |
          sha="$(git rev-parse HEAD:bip300301_enforcer)"
          tag="$(git ls-remote --tags https://github.com/LayerTwo-Labs/bip300301_enforcer.git \
            | awk -v sha="$sha" '$1 == sha { sub("refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' \
            | sort -u)"
          if [ "$(printf '%s\n' "$tag" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one enforcer release tag at $sha, got: $tag"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache bip300301_enforcer
        id: cache-enforcer
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/deps/bip300301-enforcer
          key: bip300301-enforcer-x86_64-linux-${{ steps.enforcer.outputs.tag }}-${{ steps.enforcer.outputs.sha }}

      - name: Download bip300301_enforcer ${{ steps.enforcer.outputs.tag }}
        if: steps.cache-enforcer.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/deps/enforcer-download"
          gh release download '${{ steps.enforcer.outputs.tag }}' \
            --repo LayerTwo-Labs/bip300301_enforcer \
            --pattern 'bip300301-enforcer-*-x86_64-unknown-linux-gnu' \
            --dir "${{ runner.temp }}/deps/enforcer-download"
          mv "${{ runner.temp }}"/deps/enforcer-download/bip300301-enforcer-*-x86_64-unknown-linux-gnu \
            "${{ runner.temp }}/deps/bip300301-enforcer"
          rmdir "${{ runner.temp }}/deps/enforcer-download"
          chmod +x "${{ runner.temp }}/deps/bip300301-enforcer"

      - name: Restore electrs from cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-${{ env.ELECTRS_VERSION }}

      - name: Install pinned Rust toolchain
        # Channel comes from rust-toolchain.toml.
        run: rustup toolchain install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-all-crates: "true"
          shared-key: debug-x86_64-unknown-linux-gnu

      - name: Build (debug)
        run: cargo build --bin truthcoin_dc_app --example integration_tests

      - name: Run integration tests
        id: runIntegrationTests
        run: |
          export BIP300301_ENFORCER='${{ runner.temp }}/deps/bip300301-enforcer'
          export BITCOIND='${{ runner.temp }}/deps/bitcoin-ecash/bitcoind'
          export BITCOIND_REGTEST_MAGIC='${{ steps.ecash.outputs.regtest_magic }}'
          export BITCOIND_OP_DRIVECHAIN='${{ steps.ecash.outputs.op_drivechain }}'
          export BITCOIND_FORK='${{ steps.ecash.outputs.fork }}'
          export BITCOIND_REPLAY_PROTECTION_LOCK_TIME='${{ steps.ecash.outputs.replay_protection_lock_time }}'
          export BITCOIND_UNPATCHED='${{ runner.temp }}/deps/bitcoin-unpatched/bitcoind'
          export ELECTRS='${{ runner.temp }}/electrs/target/release/electrs'
          export TRUTHCOIN_APP='target/debug/truthcoin_dc_app'
          # Each test leaks a TempDir holding per-component stdout/stderr
          # (truthcoin and the enforcer run at trace level). Point TMPDIR at a
          # known directory so the "Upload integration test logs" step can
          # collect them as artifacts when a test fails.
          export TMPDIR="$RUNNER_TEMP/it-logs"
          mkdir -p "$TMPDIR"
          target/debug/examples/integration_tests

      - name: Upload integration test logs
        # Only on failure: the leaked TempDirs are what we need to diagnose
        # flakes. Restricted to log files so we don't upload bitcoind
        # block/chainstate data.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs
          path: |
            ${{ runner.temp }}/it-logs/**/*.txt
            ${{ runner.temp }}/it-logs/**/*.log
          retention-days: 14
          if-no-files-found: warn

  test-build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: x86_64-unknown-linux-gnu
            binary-suffix: ""
            rustflags: ""
          # An Apple Silicon runner cross-compiles this target, and the
          # larger Intel runner is not available on every account.
          - os: macos-latest
            name: x86_64-apple-darwin
            binary-suffix: ""
            rustflags: ""
          - os: macos-latest
            name: aarch64-apple-darwin
            binary-suffix: ""
            rustflags: ""
          - os: ubuntu-latest
            name: x86_64-pc-windows-gnu
            binary-suffix: .exe
            rustflags: "-C linker=/usr/bin/x86_64-w64-mingw32-gcc"
    name: Test, Build ((${{ matrix.name }}))
    runs-on: ${{ matrix.os }}
    # Builds run dependency build scripts, so they get no write token. The
    # publish job below releases what they upload.
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Install windows-specific deps
        run: sudo apt install mingw-w64
        if: ${{ matrix.name == 'x86_64-pc-windows-gnu' }}

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      
      - name: Install pinned Rust toolchain
        # Channel comes from rust-toolchain.toml; the cross-compilation
        # target comes from the build matrix.
        run: |
          rustup toolchain install
          rustup target add '${{ matrix.name }}'

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-all-crates: "true"
          shared-key: ${{ matrix.name }}

      - name: Test
        run: cargo test --tests

      # Consensus math must give the same bits on each release target.
      - name: Test golden values on the release target
        run: |
          sudo apt-get install --no-install-recommends wine wine64
          cargo test --target '${{ matrix.name }}' -p truthcoin_dc --lib golden_tests
        if: ${{ matrix.name == 'x86_64-pc-windows-gnu' }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine

      - name: Test golden values on the release target
        run: cargo test --target '${{ matrix.name }}' -p truthcoin_dc --lib golden_tests
        if: ${{ matrix.name == 'x86_64-apple-darwin' }}

      - name: Build
        run: cargo build --release --target ${{ matrix.name }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: 'Set environment variables: version number and output filenames'
        run: |
          TRUTHCOIN_APP_VERSION=$(cargo metadata --format-version 1 | \
            jq -er '.packages | map(select(.name == "truthcoin_dc_app") | .version) | .[0]')
          TRUTHCOIN_APP_FILENAME="truthcoin-${TRUTHCOIN_APP_VERSION}-${{ matrix.name }}${{ matrix.binary-suffix }}"
          TRUTHCOIN_CLI_FILENAME="truthcoin-cli-${TRUTHCOIN_APP_VERSION}-${{ matrix.name }}${{ matrix.binary-suffix }}"
          TRUTHCOIN_ZIP_FILENAME="truthcoin-${TRUTHCOIN_APP_VERSION}-${{ matrix.name }}.zip"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$TRUTHCOIN_APP_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $TRUTHCOIN_APP_VERSION"
            exit 1
          fi
          echo "TRUTHCOIN_APP_VERSION=$TRUTHCOIN_APP_VERSION" >> "$GITHUB_ENV"
          echo "TRUTHCOIN_APP_FILENAME=$TRUTHCOIN_APP_FILENAME" >> "$GITHUB_ENV"
          echo "TRUTHCOIN_CLI_FILENAME=$TRUTHCOIN_CLI_FILENAME" >> "$GITHUB_ENV"
          echo "TRUTHCOIN_ZIP_FILENAME=$TRUTHCOIN_ZIP_FILENAME" >> "$GITHUB_ENV"

      - name: 'Set filenames for release binaries'
        run: |
          pushd "target/${{ matrix.name }}/release/"
          ln -fs "truthcoin_dc_app${{ matrix.binary-suffix }}" "${TRUTHCOIN_APP_FILENAME}"
          ln -fs "truthcoin_dc_app_cli${{ matrix.binary-suffix }}" "${TRUTHCOIN_CLI_FILENAME}"
          popd

      - name: 'Pack the release zip'
        # BitWindow downloads one archive per platform and takes the daemon and
        # its CLI from it. The names inside are bare, which is what its
        # extractor looks for.
        run: |
          pushd "target/${{ matrix.name }}/release/"
          cp "truthcoin_dc_app${{ matrix.binary-suffix }}" "truthcoin${{ matrix.binary-suffix }}"
          cp "truthcoin_dc_app_cli${{ matrix.binary-suffix }}" "truthcoin-cli${{ matrix.binary-suffix }}"
          zip -j "${TRUTHCOIN_ZIP_FILENAME}" \
            "truthcoin${{ matrix.binary-suffix }}" \
            "truthcoin-cli${{ matrix.binary-suffix }}"
          popd

      - name: 'Upload Artifacts (truthcoin)'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TRUTHCOIN_APP_FILENAME }}
          if-no-files-found: error
          path: |
            target/${{ matrix.name }}/release/${{ env.TRUTHCOIN_APP_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.TRUTHCOIN_CLI_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.TRUTHCOIN_ZIP_FILENAME }}

  parse-semver:
    name: Parse version info
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      prerelease: ${{ steps.parse-git-tag-name-semver.outputs.prerelease }}
    steps:
      - name: Extract Git tag name
        id: git-tag-name
        run: |
          echo "git_tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Parse Git tag name as semver
        uses: madhead/semver-utils@v5.0.0
        id: parse-git-tag-name-semver
        with:
          version: ${{ steps.git-tag-name.outputs.git_tag_name }}

  # A tag ships only once lint, the integration tests and every target's build
  # pass. Only this job holds a write token, and it runs no build.
  publish-github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [check-lint, integration-test, test-build-release, parse-semver]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          prerelease: ${{ needs.parse-semver.outputs.prerelease != '' }}

  upload-releases-to-releases-drivechain-info:
    name: Upload releases to releases.drivechain.info
    runs-on: ubuntu-latest
    needs: [publish-github-release, parse-semver]
    if: startsWith(github.ref, 'refs/tags/') && needs.parse-semver.outputs.prerelease == ''
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.13
        with:
          fileName: '*'
          tag: ${{ github.ref_name }}

      - name: Create zip files for releases.drivechain.info
        run: |
          shopt -s extglob
          mv truthcoin-+([0-9]).+([0-9]).+([0-9])-x86_64-apple-darwin truthcoin-latest-x86_64-apple-darwin
          mv truthcoin-cli-+([0-9]).+([0-9]).+([0-9])-x86_64-apple-darwin truthcoin-cli-latest-x86_64-apple-darwin
          zip L2-S13-Truthcoin-latest-x86_64-apple-darwin.zip \
            truthcoin-latest-x86_64-apple-darwin \
            truthcoin-cli-latest-x86_64-apple-darwin
          mv truthcoin-+([0-9]).+([0-9]).+([0-9])-aarch64-apple-darwin truthcoin-latest-aarch64-apple-darwin
          mv truthcoin-cli-+([0-9]).+([0-9]).+([0-9])-aarch64-apple-darwin truthcoin-cli-latest-aarch64-apple-darwin
          zip L2-S13-Truthcoin-latest-aarch64-apple-darwin.zip \
            truthcoin-latest-aarch64-apple-darwin \
            truthcoin-cli-latest-aarch64-apple-darwin
          mv truthcoin-+([0-9]).+([0-9]).+([0-9])-x86_64-pc-windows-gnu.exe truthcoin-latest-x86_64-pc-windows-gnu.exe
          mv truthcoin-cli-+([0-9]).+([0-9]).+([0-9])-x86_64-pc-windows-gnu.exe truthcoin-cli-latest-x86_64-pc-windows-gnu.exe
          zip L2-S13-Truthcoin-latest-x86_64-pc-windows-gnu.zip \
            truthcoin-latest-x86_64-pc-windows-gnu.exe \
            truthcoin-cli-latest-x86_64-pc-windows-gnu.exe
          mv truthcoin-+([0-9]).+([0-9]).+([0-9])-x86_64-unknown-linux-gnu truthcoin-latest-x86_64-unknown-linux-gnu
          mv truthcoin-cli-+([0-9]).+([0-9]).+([0-9])-x86_64-unknown-linux-gnu truthcoin-cli-latest-x86_64-unknown-linux-gnu
          zip L2-S13-Truthcoin-latest-x86_64-unknown-linux-gnu.zip \
            truthcoin-latest-x86_64-unknown-linux-gnu \
            truthcoin-cli-latest-x86_64-unknown-linux-gnu

      - name: Upload release assets to releases.drivechain.info
        uses: appleboy/scp-action@v1
        with:
          host: 45.33.96.47
          username: root
          password: ${{ secrets.RELEASES_SERVER_PW }}
          port: 22
          source: 'L2-S13-Truthcoin-latest-*.zip'
          target: '/var/www/html/'
