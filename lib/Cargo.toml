[package]
name = "truthcoin_dc"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[build-dependencies]
prost = { workspace = true }
prost-build = { workspace = true }
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[dependencies]
addr = { workspace = true }
async-lock = { workspace = true }
bech32 = { workspace = true }
bincode = { workspace = true }
bip32ish = { workspace = true }
bitcoin = { workspace = true, features = ["serde"] }
blake3 = { workspace = true }
borsh = { workspace = true, features = ["derive"] }
byteorder = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
curve25519-dalek = { workspace = true, features = ["group", "serde"] }
frost-core = { workspace = true, features = ["internals"] }
frost-ristretto255 = { workspace = true, features = ["serde"] }
fallible-iterator = { workspace = true }
error-fatality = { workspace = true }
futures = { workspace = true, features = ["alloc"] }
hashlink = { workspace = true, features = ["serde_impl"] }
heed = { workspace = true }
hickory-resolver = { workspace = true, features = ["system-config", "tokio"] }
const-hex = { workspace = true, features = ["serde"] }
hex-literal = { workspace = true }
itertools = { workspace = true }
jsonrpsee = { workspace = true }
libes = { workspace = true }
libm = { workspace = true }
nalgebra = { workspace = true }
ndarray = { workspace = true }
nonempty = { workspace = true, features = ["serialize"] }
num = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
quinn = { workspace = true }
rand = { workspace = true, features = ["chacha"] }
rayon = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
sha3 = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["alloc", "macros"] }
smallvec = { workspace = true, features = ["const_generics", "write"] }
sneed = { workspace = true, features = ["observe"] }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tiny-bip39 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["join-map", "rt"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
transitive = { workspace = true }
truthcoin_dc_types = { path = "../types", features = ["heed"] }
url = { workspace = true }
utoipa = { workspace = true, features = ["macros", "non_strict_integers"] }
x25519-dalek = { workspace = true, features = ["serde", "static_secrets"] }
zeromq = { workspace = true, optional = true }

[features]
clap = ["truthcoin_dc_types/clap"]
zmq = ["dep:zeromq"]

[dependencies.educe]
workspace = true
features = ["Clone", "Debug"]

[dependencies.governor]
workspace = true
features = ["quanta", "std"]

[dev-dependencies]
anyhow = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
tempfile = { workspace = true }
approx = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }

# [[bench]]
# name = "voting_performance"
# harness = false

[lints]
workspace = true

[lib]
name = "truthcoin_dc"
path = "lib.rs"
